- name: Deploy HTTPD
  hosts: tag_web_server
  become: yes

  tasks:
    - name: Install Apache
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Create index.html
      copy:
        content: "<h1>Apache deployed using Ansible & Jenkins</h1>"
        dest: /var/www/html/index.html

    - name: Start Apache
      service:
        name: apache2
        state: started
        enabled: yes

